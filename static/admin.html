<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfCha 总控制台</title>
    <style>
        :root {
            --bg: #0b0d17;
            --panel: #12152290;
            --panel-solid: #151a2b;
            --line: #ffffff14;
            --text: #e9edf7;
            --muted: #8b93a7;
            --gold: #d4af66;
            --green: #57c98b;
            --cyan: #59b7d6;
            --red: #e05a52;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 22px clamp(12px, 3vw, 34px) 40px;
            background:
                radial-gradient(900px 420px at 15% -10%, #2a2340 0%, transparent 60%),
                radial-gradient(700px 380px at 95% 0%, #1d2b3a 0%, transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            min-height: 100vh;
        }
        h1 { margin: 0; font-size: 19px; letter-spacing: .04em; }
        h1 small { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; letter-spacing: 0; }
        .topbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .topbar-right { display: flex; gap: 8px; align-items: center; }
        .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        .stat {
            min-width: 106px; padding: 10px 14px; border-radius: 12px;
            background: var(--panel); border: 1px solid var(--line);
        }
        .stat b { display: block; font-size: 20px; line-height: 1.3; font-variant-numeric: tabular-nums; }
        .stat span { color: var(--muted); font-size: 12px; }
        button {
            font: inherit; color: var(--text); cursor: pointer;
            background: #ffffff0f; border: 1px solid var(--line);
            padding: 8px 14px; border-radius: 10px; transition: .15s;
        }
        button:hover { background: #ffffff1c; }
        button:disabled { opacity: .45; cursor: not-allowed; }
        button.primary { background: linear-gradient(180deg, #e3bf7d, #c79b4f); border-color: #e8c98f; color: #241a08; font-weight: 700; }
        button.danger { color: var(--red); border-color: #e05a5240; }
        button.small { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
        thead th {
            text-align: left; padding: 11px 14px; font-size: 12px; font-weight: 600;
            color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap;
        }
        tbody td { padding: 12px 14px; border-bottom: 1px solid #ffffff0a; vertical-align: top; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #ffffff06; }
        .code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; letter-spacing: .12em; font-size: 14px; }
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; border: 1px solid; }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .badge.waiting { color: var(--cyan); border-color: #59b7d644; background: #59b7d614; }
        .badge.playing { color: var(--green); border-color: #57c98b44; background: #57c98b14; }
        .badge.ended { color: var(--muted); border-color: #ffffff22; background: #ffffff0a; }
        .muted { color: var(--muted); }
        .mono { font-variant-numeric: tabular-nums; }
        .names { max-width: 320px; }
        .chip {
            display: inline-block; padding: 2px 8px; margin: 0 4px 4px 0;
            background: #ffffff0d; border: 1px solid var(--line); border-radius: 7px; font-size: 12.5px;
        }
        .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
        .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .switch { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-size: 13px; user-select: none; }
        .toast {
            position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
            background: #1b2135; border: 1px solid var(--line); color: var(--text);
            padding: 10px 18px; border-radius: 999px; font-size: 13.5px;
            box-shadow: 0 12px 32px #0008; opacity: 0; pointer-events: none; transition: .2s;
        }
        .toast.show { opacity: 1; }
        .toast.error { border-color: #e05a5266; color: #ffd9d5; }
        .tokenbar { display: none; gap: 8px; align-items: center; margin-bottom: 14px; padding: 10px 14px; border-radius: 12px; background: #ffffff08; border: 1px solid var(--line); }
        .tokenbar.show { display: flex; }
        .tokenbar input { flex: 1; max-width: 320px; font: inherit; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: #0e1220; color: var(--text); }
        @media (max-width: 780px) {
            .hide-sm { display: none; }
            body { padding: 14px 10px 30px; }
            table { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>WolfCha 总控制台 <small id="server-hint">局域网房间监控</small></h1>
        <div class="topbar-right">
            <label class="switch"><input type="checkbox" id="auto-refresh" checked> 自动刷新 2s</label>
            <button id="refresh-btn" type="button">刷新</button>
            <button id="cleanup-btn" type="button" class="danger">清理空闲房间</button>
        </div>
    </div>

    <div class="tokenbar" id="tokenbar">
        <span class="muted">需要管理口令：</span>
        <input id="token-input" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
        <button id="token-save" type="button">保存</button>
        <span class="muted">（服务端设置了 ADMIN_TOKEN 时才会要求）</span>
    </div>

    <div class="stats" id="stats"></div>

    <table>
        <thead>
            <tr>
                <th>房号</th>
                <th>状态</th>
                <th class="hide-sm">局</th>
                <th>进度</th>
                <th class="hide-sm">真人</th>
                <th>连接</th>
                <th>空闲</th>
                <th class="hide-sm">创建</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="rooms-body">
            <tr><td colspan="9" class="empty">加载中…</td></tr>
        </tbody>
    </table>

    <div class="toast" id="toast"></div>
    <script src="/static/admin.js"></script>
</body>
</html>
